# Digest generation settings.
#
# Everything the ranking and rendering need is here so behaviour can be tuned
# without touching code. Omitted keys fall back to the defaults in
# telescope/config.py.

# Where the readable digests are written. This is the only thing that syncs to
# Google Drive. Override with the TELESCOPE_DIGEST_DIR environment variable.
output_dir: "/Users/kohtongliang/Library/CloudStorage/GoogleDrive-play@headphoneturtlegames.com/My Drive/Studio/Projects/Telescope/digests"

timezone: Asia/Singapore

# Optional. If set, a small JSON summary is POSTed here after the digest is
# written — a Slack or Discord webhook, or anything that accepts JSON. A failure
# is reported but never fatal: the digest is already on disk by then.
webhook_url: null

# Window used when no previous digest has been recorded yet.
window_hours_default: 24

# Only used for the webhook's top_stories summary now, not for a digest
# section: the digest is organised by topic instead.
max_top_stories: 5
# "Everything else" is the highest-ranked stories the topic sections did not
# already show. Kept small because every entry is a full story block.
long_tail_limit: 3
# Stories shown per topic. Each one is a full story block with its other
# reports listed, so this stays low or the digest stops being scannable.
topic_limit: 3
# Below this many stories, say so rather than shipping a thin digest that
# trains the reader to ignore it.
quiet_day_threshold: 3
summary_chars: 260

recency_half_life_hours: 18.0

# Ranking weights. Deterministic; no model decides what matters.
weights:
  breadth: 1.0        # distinct outlets covering the story
  tier: 0.8           # best source tier in the cluster
  recency: 1.2        # exponential decay from publication
  keywords: 0.9       # matched significance keywords
  watchlist: 1.5      # mentions something you track
  first_party: 0.4    # a platform holder said it themselves

# Applied when the phrase appears in the primary headline.
keyword_weights:
  delay: 1.2
  delayed: 1.2
  delays: 1.2
  layoff: 1.5
  layoffs: 1.5
  redundancies: 1.4
  "shut down": 1.5
  "shutting down": 1.5
  closure: 1.4
  acquired: 1.3
  acquisition: 1.3
  merger: 1.2
  lawsuit: 1.1
  strike: 1.3
  union: 1.2
  cancelled: 1.1
  canceled: 1.1
  funding: 1.1
  bankruptcy: 1.4
  "early access": 0.8
  "release date": 0.9
  "out now": 0.7
  exclusive: 0.7
  review: 0.3

# Subtracted when the phrase appears in the primary headline. Without a model,
# this filter is the difference between a useful brief and an unreadable one.
demote_keywords:
  rumor: 0.9
  rumour: 0.9
  reportedly: 0.6
  leak: 0.7
  leaked: 0.7
  "deal": 0.4
  sale: 0.5
  "% off": 1.0
  discount: 0.6
  "best games": 0.8
  "where to buy": 0.9
  "how to": 0.5
  guide: 0.5
  tierlist: 0.8
  "tier list": 0.8
  patch notes: 0.4
