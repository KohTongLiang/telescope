# Telescope sources
#
# Every feed below was verified 2026-09-15 by direct request: HTTP status, body
# type, item count and age of newest item. Source health is re-checked on every
# sync and reported in the digest footer, so this is a starting point, not a
# guarantee. A feed that dies is surfaced rather than silently ignored.
#
# tier: first_party | trade | enthusiast | aggregator | community
# axis: business | development | releases | platform | general | community

