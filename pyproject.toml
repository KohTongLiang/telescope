[project]
name = "telescope"
version = "0.1.0"
description = "Games industry news and release digest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
telescope = "telescope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telescope"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# feedparser emits one DeprecationWarning per entry about its temporary
# updated->published mapping. Noise from a dependency, not from this code.
filterwarnings = ["ignore::DeprecationWarning:feedparser"]
